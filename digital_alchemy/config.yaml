name: "Code Runner"
description: "Digital Alchemy code deployment runner"
version: "25.7.1"
slug: "code_runner"
url: https://github.com/Digital-Alchemy-TS/addons/tree/main/digital_alchemy
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64

options:
  app_root: /share/digital_alchemy
  main: src/main.mts
  node_env: production
  run_mode: bun
  packages: []

schema:
  app_root: str
  main: str
  node_env: str
  run_mode: list(node|tsx|bun)
  packages:
    - str

map:
  - share:rw
  - backup:rw
  - config:rw

ports:
  3000/tcp: 3000
